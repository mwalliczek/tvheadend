<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 1004 494" width="1004" height="494" role="img" aria-label="Pipeline overview">
<style>
svg { --bg: #fbfaf7; --fg: #1d1f24; --muted: #5d6270; --card: #ffffff; --line: #d9dbe1; --soft: #f1f2f5; --c-rf: #2f6fd6; --c-sync: #0f9488; --c-ofdm: #7c4dcc; --c-fec: #d9771a; --c-audio: #2e9a46; --c-out: #c23b5a; --c-rf-s: #e3edfb; --c-sync-s: #ddf3f0; --c-ofdm-s: #eee6fa; --c-fec-s: #fbeedd; --c-audio-s: #e2f4e6; --c-out-s: #f8e1e7; --code-bg: #f1f2f5; }
@media (prefers-color-scheme: dark) { svg { --bg: #15171c; --fg: #e7e8ec; --muted: #a0a5b2; --card: #1d2027; --line: #343844; --soft: #252932; --c-rf: #6fa3ff; --c-sync: #3cc7b9; --c-ofdm: #b18cff; --c-fec: #ffa24d; --c-audio: #5fd17a; --c-out: #ff7d9a; --c-rf-s: #1c2a44; --c-sync-s: #143633; --c-ofdm-s: #2a2142; --c-fec-s: #3a2a17; --c-audio-s: #183320; --c-out-s: #3b1d26; --code-bg: #262a33; } }
.bgcard { fill: var(--card); stroke: var(--line); }
svg text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; fill: var(--fg); }
svg .t-m { fill: var(--muted); }
svg .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
svg .ln { stroke: var(--line); fill: none; }
svg .ax { stroke: var(--muted); fill: none; stroke-width: 1.2; }
svg .card { fill: var(--card); stroke: var(--line); }
svg .soft { fill: var(--soft); }
svg .f-rf { fill: var(--c-rf-s); stroke: var(--c-rf); } svg .f-sync { fill: var(--c-sync-s); stroke: var(--c-sync); }
svg .f-ofdm { fill: var(--c-ofdm-s); stroke: var(--c-ofdm); } svg .f-fec { fill: var(--c-fec-s); stroke: var(--c-fec); }
svg .f-audio { fill: var(--c-audio-s); stroke: var(--c-audio); } svg .f-out { fill: var(--c-out-s); stroke: var(--c-out); }
svg .s-rf { fill: var(--c-rf); } svg .s-sync { fill: var(--c-sync); } svg .s-ofdm { fill: var(--c-ofdm); }
svg .s-fec { fill: var(--c-fec); } svg .s-audio { fill: var(--c-audio); } svg .s-out { fill: var(--c-out); }
svg .st-rf { stroke: var(--c-rf); fill: none; } svg .st-sync { stroke: var(--c-sync); fill: none; } svg .st-ofdm { stroke: var(--c-ofdm); fill: none; }
svg .st-fec { stroke: var(--c-fec); fill: none; } svg .st-audio { stroke: var(--c-audio); fill: none; } svg .st-out { stroke: var(--c-out); fill: none; }
svg .t-rf { fill: var(--c-rf); } svg .t-sync { fill: var(--c-sync); } svg .t-ofdm { fill: var(--c-ofdm); }
svg .t-fec { fill: var(--c-fec); } svg .t-audio { fill: var(--c-audio); } svg .t-out { fill: var(--c-out); }
svg .arr { stroke: var(--muted); stroke-width: 1.6; fill: none; marker-end: url(#ah); }
svg .b { font-weight: 700; }
</style>
<defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--muted)"/>
    </marker>
  </defs>
<rect x="-12" y="-12" width="1004" height="494" rx="12" class="bgcard"/>

  <!-- row 1 -->
  <g>
    <rect x="10" y="20" width="140" height="96" rx="12" class="f-rf"/>
    <text x="80" y="46" text-anchor="middle" class="b">📡 Antenna</text>
    <text x="80" y="68" text-anchor="middle" font-size="12" class="t-m">Band III</text>
    <text x="80" y="86" text-anchor="middle" font-size="12" class="t-m">174–240 MHz</text>
    <text x="80" y="104" text-anchor="middle" font-size="12" class="t-m">1.5 MHz ensemble</text>
  </g>
  <path d="M150 68 H182" class="arr"/>
  <g>
    <rect x="186" y="20" width="160" height="96" rx="12" class="f-rf"/>
    <text x="266" y="44" text-anchor="middle" class="b">RTL‑SDR stick</text>
    <text x="266" y="64" text-anchor="middle" font-size="12" class="t-m">R820T tuner → IF</text>
    <text x="266" y="82" text-anchor="middle" font-size="12" class="t-m">RTL2832U: 8‑bit ADC</text>
    <text x="266" y="100" text-anchor="middle" font-size="12" class="t-m">I/Q at 2.048 MS/s</text>
  </g>
  <path d="M346 68 H378" class="arr"/>
  <g>
    <rect x="382" y="20" width="170" height="96" rx="12" class="f-rf"/>
    <text x="467" y="44" text-anchor="middle" class="b">1 · USB → FIFO</text>
    <text x="467" y="64" text-anchor="middle" font-size="12" class="mono t-m">rtlsdr_dab_callback</text>
    <text x="467" y="82" text-anchor="middle" font-size="12" class="mono t-m">cbWrite (sdr_fifo.c)</text>
    <text x="467" y="100" text-anchor="middle" font-size="12" class="t-m">4 frames buffer, 1.5 MB</text>
  </g>
  <path d="M552 68 H584" class="arr"/>
  <g>
    <rect x="588" y="20" width="170" height="96" rx="12" class="f-sync"/>
    <text x="673" y="44" text-anchor="middle" class="b">2 · Samples</text>
    <text x="673" y="64" text-anchor="middle" font-size="12" class="mono t-m">getSamples</text>
    <text x="673" y="82" text-anchor="middle" font-size="12" class="t-m">uint8 → float, mix by</text>
    <text x="673" y="100" text-anchor="middle" font-size="12" class="t-m">−freq. error</text>
  </g>
  <path d="M758 68 H790" class="arr"/>
  <g>
    <rect x="794" y="20" width="176" height="96" rx="12" class="f-sync"/>
    <text x="882" y="44" text-anchor="middle" class="b">3 · Synchronize</text>
    <text x="882" y="64" text-anchor="middle" font-size="12" class="t-m">null dip, phase ref.</text>
    <text x="882" y="82" text-anchor="middle" font-size="12" class="t-m">correlation, coarse +</text>
    <text x="882" y="100" text-anchor="middle" font-size="12" class="t-m">fine frequency</text>
  </g>
  <!-- down turn -->
  <path d="M882 116 V150 H880" class="arr"/>
  <!-- row 2 (right to left) -->
  <g>
    <rect x="794" y="156" width="176" height="96" rx="12" class="f-ofdm"/>
    <text x="882" y="180" text-anchor="middle" class="b">4 · OFDM</text>
    <text x="882" y="200" text-anchor="middle" font-size="12" class="t-m">FFT 2048, DQPSK,</text>
    <text x="882" y="218" text-anchor="middle" font-size="12" class="t-m">phase fix, soft bits,</text>
    <text x="882" y="236" text-anchor="middle" font-size="12" class="t-m">freq. deinterleave</text>
  </g>
  <path d="M794 186 H762" class="arr"/>
  <path d="M794 226 H762" class="arr"/>
  <g>
    <rect x="588" y="156" width="170" height="44" rx="10" class="f-fec"/>
    <text x="673" y="176" text-anchor="middle" class="b" font-size="14">5 · FIC (symbols 1–3)</text>
    <text x="673" y="193" text-anchor="middle" font-size="11.5" class="t-m">Viterbi → FIBs → FIGs</text>
    <rect x="588" y="208" width="170" height="44" rx="10" class="f-fec"/>
    <text x="673" y="228" text-anchor="middle" class="b" font-size="14">6 · MSC (symbols 4–75)</text>
    <text x="673" y="245" text-anchor="middle" font-size="11.5" class="t-m">CIF → time deint. → Viterbi</text>
  </g>
  <path d="M588 230 H556" class="arr"/>
  <g>
    <rect x="382" y="156" width="170" height="96" rx="12" class="f-audio"/>
    <text x="467" y="180" text-anchor="middle" class="b">7 · DAB+ audio</text>
    <text x="467" y="200" text-anchor="middle" font-size="12" class="t-m">superframe, fire code,</text>
    <text x="467" y="218" text-anchor="middle" font-size="12" class="t-m">RS(120,110), AUs,</text>
    <text x="467" y="236" text-anchor="middle" font-size="12" class="t-m">LOAS/LATM frames</text>
  </g>
  <path d="M382 204 H350" class="arr"/>
  <g>
    <rect x="186" y="156" width="160" height="96" rx="12" class="f-out"/>
    <text x="266" y="180" text-anchor="middle" class="b">8 · tvheadend</text>
    <text x="266" y="200" text-anchor="middle" font-size="12" class="t-m">th_pkt → streaming</text>
    <text x="266" y="218" text-anchor="middle" font-size="12" class="t-m">→ HTSP / DVR</text>
    <text x="266" y="236" text-anchor="middle" font-size="12" class="t-m">aac_latm or AAC</text>
  </g>
  <path d="M186 204 H154" class="arr"/>
  <g>
    <rect x="10" y="156" width="140" height="96" rx="12" class="f-out"/>
    <text x="80" y="180" text-anchor="middle" class="b">Kodi 🔊</text>
    <text x="80" y="200" text-anchor="middle" font-size="12" class="t-m">pvr.hts + ffmpeg</text>
    <text x="80" y="218" text-anchor="middle" font-size="12" class="t-m">HE‑AAC v2 decode</text>
    <text x="80" y="236" text-anchor="middle" font-size="12" class="t-m">PCM → speaker</text>
  </g>
  <!-- data rate ribbon -->
  <text x="10" y="300" class="b" font-size="13">Data rate along the way (one 72 kbit/s station)</text>
  <g font-size="11.5">
    <rect x="10" y="314" width="300" height="22" rx="4" class="s-rf" opacity="0.8"/>
    <text x="318" y="330">4.1 MB/s · bytes I,Q,I,Q…</text>
    <rect x="10" y="342" width="960" height="22" rx="4" class="s-sync" opacity="0.8"/>
    <text x="18" y="358" style="fill:#fff" class="b">16.4 MB/s · complex float after getSamples (the biggest stream, ×4)</text>
    <rect x="10" y="370" width="49" height="22" rx="4" class="s-ofdm" opacity="0.9"/>
    <text x="67" y="386">≈ 0.8 MB/s soft bits (3072 int16 per symbol: the FIC and the symbols of your station)</text>
    <rect x="10" y="398" width="4" height="22" rx="1" class="s-fec"/>
    <text x="22" y="414">72 kB/s · your station only, after Viterbi, still one bit per byte (outV)</text>
    <rect x="10" y="426" width="2" height="22" rx="1" class="s-audio"/>
    <text x="22" y="442">9 kB/s · AAC access units (72 kbit/s) → 1.4 Mbit/s PCM at the speaker</text>
  </g>

</svg>
