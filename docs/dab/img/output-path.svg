<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 1004 324" width="1004" height="324" role="img" aria-label="Output path">
<style>
svg { --bg: #fbfaf7; --fg: #1d1f24; --muted: #5d6270; --card: #ffffff; --line: #d9dbe1; --soft: #f1f2f5; --c-rf: #2f6fd6; --c-sync: #0f9488; --c-ofdm: #7c4dcc; --c-fec: #d9771a; --c-audio: #2e9a46; --c-out: #c23b5a; --c-rf-s: #e3edfb; --c-sync-s: #ddf3f0; --c-ofdm-s: #eee6fa; --c-fec-s: #fbeedd; --c-audio-s: #e2f4e6; --c-out-s: #f8e1e7; --code-bg: #f1f2f5; }
@media (prefers-color-scheme: dark) { svg { --bg: #15171c; --fg: #e7e8ec; --muted: #a0a5b2; --card: #1d2027; --line: #343844; --soft: #252932; --c-rf: #6fa3ff; --c-sync: #3cc7b9; --c-ofdm: #b18cff; --c-fec: #ffa24d; --c-audio: #5fd17a; --c-out: #ff7d9a; --c-rf-s: #1c2a44; --c-sync-s: #143633; --c-ofdm-s: #2a2142; --c-fec-s: #3a2a17; --c-audio-s: #183320; --c-out-s: #3b1d26; --code-bg: #262a33; } }
.bgcard { fill: var(--card); stroke: var(--line); }
svg text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; fill: var(--fg); }
svg .t-m { fill: var(--muted); }
svg .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
svg .ln { stroke: var(--line); fill: none; }
svg .ax { stroke: var(--muted); fill: none; stroke-width: 1.2; }
svg .card { fill: var(--card); stroke: var(--line); }
svg .soft { fill: var(--soft); }
svg .f-rf { fill: var(--c-rf-s); stroke: var(--c-rf); } svg .f-sync { fill: var(--c-sync-s); stroke: var(--c-sync); }
svg .f-ofdm { fill: var(--c-ofdm-s); stroke: var(--c-ofdm); } svg .f-fec { fill: var(--c-fec-s); stroke: var(--c-fec); }
svg .f-audio { fill: var(--c-audio-s); stroke: var(--c-audio); } svg .f-out { fill: var(--c-out-s); stroke: var(--c-out); }
svg .s-rf { fill: var(--c-rf); } svg .s-sync { fill: var(--c-sync); } svg .s-ofdm { fill: var(--c-ofdm); }
svg .s-fec { fill: var(--c-fec); } svg .s-audio { fill: var(--c-audio); } svg .s-out { fill: var(--c-out); }
svg .st-rf { stroke: var(--c-rf); fill: none; } svg .st-sync { stroke: var(--c-sync); fill: none; } svg .st-ofdm { stroke: var(--c-ofdm); fill: none; }
svg .st-fec { stroke: var(--c-fec); fill: none; } svg .st-audio { stroke: var(--c-audio); fill: none; } svg .st-out { stroke: var(--c-out); fill: none; }
svg .t-rf { fill: var(--c-rf); } svg .t-sync { fill: var(--c-sync); } svg .t-ofdm { fill: var(--c-ofdm); }
svg .t-fec { fill: var(--c-fec); } svg .t-audio { fill: var(--c-audio); } svg .t-out { fill: var(--c-out); }
svg .arr { stroke: var(--muted); stroke-width: 1.6; fill: none; marker-end: url(#ah); }
svg .b { font-weight: 700; }
</style>
<defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--muted)"/>
    </marker>
  </defs>
<rect x="-12" y="-12" width="1004" height="324" rx="12" class="bgcard"/>

  <g font-size="12">
    <rect x="10" y="30" width="190" height="96" rx="10" class="f-audio"/>
    <text x="105" y="54" text-anchor="middle" class="b">dataCallback</text>
    <text x="105" y="74" text-anchor="middle" class="t-m">pkt_alloc(SCT_MP4A)</text>
    <text x="105" y="92" text-anchor="middle" class="t-m">duration = 90000·960/sr</text>
    <text x="105" y="110" text-anchor="middle" class="t-m">channels from SBR/PS</text>
    <path d="M200 78 H236" class="arr"/>
    <rect x="240" y="30" width="170" height="96" rx="10" class="f-out"/>
    <text x="325" y="54" text-anchor="middle" class="b">streaming pad</text>
    <text x="325" y="74" text-anchor="middle" class="mono t-m">streaming_service_</text>
    <text x="325" y="90" text-anchor="middle" class="mono t-m">deliver</text>
    <text x="325" y="110" text-anchor="middle" class="t-m">SMT_PACKET</text>
    <path d="M410 60 H460 V50 H486" class="arr"/>
    <path d="M410 100 H460 V200 H486" class="arr"/>
    <rect x="490" y="14" width="210" height="84" rx="10" class="f-out"/>
    <text x="595" y="38" text-anchor="middle" class="b">htsp_server.c</text>
    <text x="595" y="58" text-anchor="middle" class="t-m">client "Kodi…" → aac_latm</text>
    <text x="595" y="76" text-anchor="middle" class="t-m">others (TvhClient) → AAC</text>
    <text x="595" y="92" text-anchor="middle" class="mono t-m" font-size="10.5">htsp_client_wants_ffmpeg_names</text>
    <rect x="490" y="160" width="210" height="84" rx="10" class="f-out"/>
    <text x="595" y="184" text-anchor="middle" class="b">DVR</text>
    <text x="595" y="204" text-anchor="middle" class="t-m">dvr_rec_dab_muxer → audioes</text>
    <text x="595" y="222" text-anchor="middle" class="t-m">MC_MP4A, .aac file (PR #20)</text>
    <path d="M700 56 H736" class="arr"/>
    <rect x="740" y="14" width="230" height="230" rx="10" class="card"/>
    <text x="855" y="38" text-anchor="middle" class="b">Kodi</text>
    <text x="855" y="58" text-anchor="middle" class="t-m">pvr.hts → ffmpeg</text>
    <rect x="756" y="70" width="198" height="34" rx="6" class="f-audio"/><text x="855" y="92" text-anchor="middle">AAC core: 960 → 24 kHz</text>
    <rect x="756" y="110" width="198" height="34" rx="6" class="f-audio" opacity="0.8"/><text x="855" y="132" text-anchor="middle">SBR: highs → 48 kHz</text>
    <rect x="756" y="150" width="198" height="34" rx="6" class="f-audio" opacity="0.6"/><text x="855" y="172" text-anchor="middle">PS: mono → stereo</text>
    <text x="855" y="214" text-anchor="middle" font-size="22">🔊</text>
    <text x="855" y="236" text-anchor="middle" class="t-m">48 kHz stereo PCM</text>
  </g>
  <text x="10" y="280" font-size="12" class="t-m">Also over HTSP: signal, SNR, BER, unc, PER from sdr_dab_service_instance_stats and the monitor (PR #14), shown by Kodi's stream info.</text>

</svg>
