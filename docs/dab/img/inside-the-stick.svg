<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -12 1004 264" width="1004" height="264" role="img" aria-label="Inside the stick">
<style>
svg { --bg: #fbfaf7; --fg: #1d1f24; --muted: #5d6270; --card: #ffffff; --line: #d9dbe1; --soft: #f1f2f5; --c-rf: #2f6fd6; --c-sync: #0f9488; --c-ofdm: #7c4dcc; --c-fec: #d9771a; --c-audio: #2e9a46; --c-out: #c23b5a; --c-rf-s: #e3edfb; --c-sync-s: #ddf3f0; --c-ofdm-s: #eee6fa; --c-fec-s: #fbeedd; --c-audio-s: #e2f4e6; --c-out-s: #f8e1e7; --code-bg: #f1f2f5; }
@media (prefers-color-scheme: dark) { svg { --bg: #15171c; --fg: #e7e8ec; --muted: #a0a5b2; --card: #1d2027; --line: #343844; --soft: #252932; --c-rf: #6fa3ff; --c-sync: #3cc7b9; --c-ofdm: #b18cff; --c-fec: #ffa24d; --c-audio: #5fd17a; --c-out: #ff7d9a; --c-rf-s: #1c2a44; --c-sync-s: #143633; --c-ofdm-s: #2a2142; --c-fec-s: #3a2a17; --c-audio-s: #183320; --c-out-s: #3b1d26; --code-bg: #262a33; } }
.bgcard { fill: var(--card); stroke: var(--line); }
svg text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; fill: var(--fg); }
svg .t-m { fill: var(--muted); }
svg .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
svg .ln { stroke: var(--line); fill: none; }
svg .ax { stroke: var(--muted); fill: none; stroke-width: 1.2; }
svg .card { fill: var(--card); stroke: var(--line); }
svg .soft { fill: var(--soft); }
svg .f-rf { fill: var(--c-rf-s); stroke: var(--c-rf); } svg .f-sync { fill: var(--c-sync-s); stroke: var(--c-sync); }
svg .f-ofdm { fill: var(--c-ofdm-s); stroke: var(--c-ofdm); } svg .f-fec { fill: var(--c-fec-s); stroke: var(--c-fec); }
svg .f-audio { fill: var(--c-audio-s); stroke: var(--c-audio); } svg .f-out { fill: var(--c-out-s); stroke: var(--c-out); }
svg .s-rf { fill: var(--c-rf); } svg .s-sync { fill: var(--c-sync); } svg .s-ofdm { fill: var(--c-ofdm); }
svg .s-fec { fill: var(--c-fec); } svg .s-audio { fill: var(--c-audio); } svg .s-out { fill: var(--c-out); }
svg .st-rf { stroke: var(--c-rf); fill: none; } svg .st-sync { stroke: var(--c-sync); fill: none; } svg .st-ofdm { stroke: var(--c-ofdm); fill: none; }
svg .st-fec { stroke: var(--c-fec); fill: none; } svg .st-audio { stroke: var(--c-audio); fill: none; } svg .st-out { stroke: var(--c-out); fill: none; }
svg .t-rf { fill: var(--c-rf); } svg .t-sync { fill: var(--c-sync); } svg .t-ofdm { fill: var(--c-ofdm); }
svg .t-fec { fill: var(--c-fec); } svg .t-audio { fill: var(--c-audio); } svg .t-out { fill: var(--c-out); }
svg .arr { stroke: var(--muted); stroke-width: 1.6; fill: none; marker-end: url(#ah); }
svg .b { font-weight: 700; }
</style>
<defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill: var(--muted)"/>
    </marker>
  </defs>
<rect x="-12" y="-12" width="1004" height="264" rx="12" class="bgcard"/>

<rect x="10" y="60" width="110" height="70" rx="10" class="f-rf"/>
<text x="65.0" y="82" font-size="12.5" text-anchor="middle" class="b">antenna</text>
<text x="65.0" y="100" font-size="11" text-anchor="middle" class="t-m">204.64 MHz</text>
<text x="65.0" y="116" font-size="11" text-anchor="middle" class="t-m">µV, real</text>
<path d="M120 95 H144" class="arr"/>
<rect x="148" y="60" width="170" height="70" rx="10" class="f-rf"/>
<text x="233.0" y="82" font-size="12.5" text-anchor="middle" class="b">R820T tuner</text>
<text x="233.0" y="100" font-size="11" text-anchor="middle" class="t-m">LNA + mixer → IF</text>
<text x="233.0" y="116" font-size="11" text-anchor="middle" class="t-m">≈ 3.57 MHz, real</text>
<path d="M318 95 H342" class="arr"/>
<rect x="346" y="60" width="120" height="70" rx="10" class="f-sync"/>
<text x="406.0" y="82" font-size="12.5" text-anchor="middle" class="b">8‑bit ADC</text>
<text x="406.0" y="100" font-size="11" text-anchor="middle" class="t-m">28.8 MHz</text>
<text x="406.0" y="116" font-size="11" text-anchor="middle" class="t-m">one real value</text>
<path d="M466 95 H490 V60 H510" class="arr"/><path d="M490 95 V150 H510" class="arr"/>
<circle cx="530" cy="60" r="18" class="f-sync"/><text x="530" y="65" font-size="16" text-anchor="middle" class="b">×</text>
<circle cx="530" cy="150" r="18" class="f-sync"/><text x="530" y="155" font-size="16" text-anchor="middle" class="b">×</text>
<text x="530" y="30" font-size="11" text-anchor="middle" class="mono t-rf">cos(2π·IF·t)</text>
<text x="530" y="190" font-size="11" text-anchor="middle" class="mono t-out">−sin(2π·IF·t)</text>
<path d="M548 60 H580" class="arr"/><path d="M548 150 H580" class="arr"/>
<rect x="584" y="28" width="150" height="64" rx="10" class="f-sync"/>
<text x="659.0" y="50" font-size="12.5" text-anchor="middle" class="b">low‑pass +</text>
<text x="659.0" y="68" font-size="11" text-anchor="middle" class="t-m">resample to</text>
<text x="659.0" y="84" font-size="11" text-anchor="middle" class="t-m">2.048 MS/s</text>
<rect x="584" y="118" width="150" height="64" rx="10" class="f-sync"/>
<text x="659.0" y="140" font-size="12.5" text-anchor="middle" class="b">low‑pass +</text>
<text x="659.0" y="158" font-size="11" text-anchor="middle" class="t-m">resample to</text>
<text x="659.0" y="174" font-size="11" text-anchor="middle" class="t-m">2.048 MS/s</text>
<path d="M734 60 H770" class="arr"/><path d="M734 150 H770" class="arr"/>
<rect x="774" y="28" width="196" height="64" rx="10" class="f-rf"/>
<text x="872.0" y="50" font-size="12.5" text-anchor="middle" class="b">I byte</text>
<text x="872.0" y="68" font-size="11" text-anchor="middle" class="t-m">in‑phase</text>
<text x="872.0" y="84" font-size="11" text-anchor="middle" class="t-m">128 = 0</text>
<rect x="774" y="118" width="196" height="64" rx="10" class="f-rf"/>
<text x="872.0" y="140" font-size="12.5" text-anchor="middle" class="b">Q byte</text>
<text x="872.0" y="158" font-size="11" text-anchor="middle" class="t-m">quadrature</text>
<text x="872.0" y="174" font-size="11" text-anchor="middle" class="t-m">128 = 0</text>
<rect x="480" y="10" width="264" height="214" rx="12" fill="none" stroke="var(--line)" stroke-dasharray="5 4"/>
<text x="612" y="236" font-size="11" text-anchor="middle" class="t-m">RTL2832U: the I/Q split is done digitally</text>

</svg>
